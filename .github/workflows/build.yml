name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build-ps2:
    name: PlayStation 2
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install build tools
        run: sudo apt update && sudo apt install -y ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ps2-${{ github.run_id }}
          restore-keys: |
            ccache-ps2-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Prepare ps2dev directory permissions
        run: |
          sudo mkdir -p /usr/local/ps2dev
          sudo chown -R $USER:$USER /usr/local/ps2dev

      - name: Cache ps2dev toolchain
        id: cache-ps2dev
        uses: actions/cache@v4
        with:
          path: /usr/local/ps2dev
          key: cache-ps2dev-ubuntu-24.04

      - name: Install ps2dev toolchain
        if: steps.cache-ps2dev.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /usr/local/ps2dev
          curl -fSL -o /tmp/ps2dev.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xf /tmp/ps2dev.tar.gz --strip-components 1 -C /usr/local/ps2dev
          rm -f /tmp/ps2dev.tar.gz

      - name: Set environment
        run: |
          echo "PS2DEV=/usr/local/ps2dev" >> "$GITHUB_ENV"
          echo "PS2SDK=/usr/local/ps2dev/ps2sdk" >> "$GITHUB_ENV"
          echo "/usr/local/ps2dev/ee/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/ps2sdk/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build/ps2-release -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/ps2_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DPLATFORM=PS2
          -DPS2_ENABLE_MX4SIO=ON
          -DPS2_ENABLE_SOUND=ON
          -DPS2_ENABLE_PERSPECTIVE_TEXTURES=ON
          -DPS2_RENDER_STATS=OFF
          -DPS2_ENABLE_VU1_TERRAIN=ON
          -DMC_LOG_LEVEL=0
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/ps2-release --parallel

      - name: Prepare ELF for release
        run: |
          mkdir -p dist
          cp bin/ps2/usb/MCBETA/OptiCraft.elf dist/OptiCraft-ps2.elf

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (Latest)
          prerelease: true
          body: |
            Automated nightly build of the PlayStation 2 port.
            
            **Build Details:**
            - Commit: ${{ github.sha }}
            - Date: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          files: dist/OptiCraft-ps2.elf
          make_latest: true